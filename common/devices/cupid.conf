# Xiaomi 12: initial SM8450 bring-up, derived from the supplied runtime FDT.
NAME="Xiaomi 12 (cupid)"
KIND=phone
SOC="Qualcomm Snapdragon 8 Gen 1 (SM8450)"
UEFI_TARGET=cupid
UEFI_FD=
DTB=
# FD from stock uefiplat.cfg; XNUP occupies F6000000..FA000000 in live low RAM.
FD_BASE=0xA7000000
FD_SIZE=0x400000
PAYLOAD_BASE=0xF6000000
BOOT_HEADER_VERSION=4
FB_BASE=0xB8000000              # splash reservation; actual GOP base awaits hardware validation
WIFI_ATH11K=0
# No redwood peripheral driver is enabled during initial CPU/framebuffer bring-up.
BOOTARGS="-v cpus=1 touchscreen=0 buttons=0 cpufreq=0 ddr=0 gpu=0 wifi=0 adsp=0 battery=0 ufs_write=0"
DEFAULT_SECS=60
USERLAND_VARS="GL= WIFID=0"
FIRMWARE_ROOT="$ROOT/../codex-cupid/firmware"
FIRMWARE=""
